name: Build debug APK

# Builds a debug APK (unsigned debug keystore — fine for sideloading onto a
# test device, not for a Play Store release) and publishes it as a GitHub
# Release so it can be downloaded without a build step. Runs on every push
# to main/merged-everything, and can be run manually from the Actions tab.
on:
  push:
    branches: [main, merged-everything]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with build number
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/CarKeep-debug-${{ github.run_number }}.apk"

      - name: Publish GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "CarKeep debug build #${{ github.run_number }}"
          body: |
            Automated debug build from commit ${{ github.sha }}.
            Debug build only — sideload for testing, not a signed release build.
          files: dist/*.apk
